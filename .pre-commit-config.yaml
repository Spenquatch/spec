repos:
- repo: local
  hooks:
  - id: singleton-detection
    name: Singleton Pattern Detection
    entry: python scripts/check_singletons.py
    language: system
    files: ^spec_cli/.*\.py$
    description: 'Detect singleton patterns in Python code'
    pass_filenames: true
    require_serial: false
    additional_dependencies: []
  - id: sync-pre-commit-deps
    name: Sync pre-commit dependencies with poetry
    entry: python scripts/sync-pre-commit.py --quiet
    language: system
    pass_filenames: false
    files: ^pyproject\.toml$
  - id: auto-stage-formatted
    name: Auto-stage formatted files
    entry: python scripts/auto-stage-formatted.py
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
  - id: mypy
    name: mypy
    entry: poetry run mypy
    language: system
    types:
    - python
    args:
    - spec_cli/
    - --python-version=3.10
    - --no-error-summary
    files: ^spec_cli/
    pass_filenames: false
  - id: pydocstyle
    name: Documentation style check
    entry: poetry run docs
    language: system
    types:
    - python
    files: ^spec_cli/
    pass_filenames: false
  - id: coverage-check
    name: Test coverage check (80% minimum)
    entry: poetry run test
    language: system
    types:
    - python
    files: ^spec_cli/
    pass_filenames: false
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.12
  hooks:
  - id: ruff
    args:
    - --fix
    files: ^spec_cli/
  - id: ruff-format
    files: ^spec_cli/
- repo: https://github.com/pycqa/bandit
  rev: 1.7.8
  hooks:
  - id: bandit
    args:
    - -lll
    - --exclude
    - tests,scripts
- repo: local
  hooks:
  - id: auto-stage-formatted
    name: Auto-stage formatted files
    entry: python scripts/auto-stage-formatted.py
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
