repos:
- repo: local
  hooks:
  - id: sync-pre-commit-deps
    name: Sync pre-commit dependencies with poetry
    entry: python scripts/sync-pre-commit.py --quiet
    language: system
    pass_filenames: false
    files: ^pyproject\.toml$
  - id: auto-stage-formatted
    name: Auto-stage formatted files
    entry: python scripts/auto-stage-formatted.py
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
  - id: mypy
    name: mypy
    entry: poetry run mypy
    language: system
    types:
    - python
    args:
    - spec_cli/
    - --python-version=3.10
    - --no-error-summary
    files: ^spec_cli/
    pass_filenames: false
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.12
  hooks:
  - id: ruff
    args:
    - --fix
    files: ^spec_cli/
  - id: ruff-format
    files: ^spec_cli/
- repo: https://github.com/pycqa/bandit
  rev: 1.7.8
  hooks:
  - id: bandit
    args:
    - -lll
    - --exclude
    - tests,scripts
- repo: local
  hooks:
  - id: auto-stage-formatted
    name: Auto-stage formatted files
    entry: python scripts/auto-stage-formatted.py
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
