# Configuration for using llama.cpp provider with Metal GPU acceleration
#
# For completely clean output without warnings, run with:
# TORCH_DISTRIBUTED_DETAIL=ERROR PYTHONWARNINGS=ignore::RuntimeWarning poetry run python -m spec_cli.cli.app gen <file>

ai:
  enabled: true
  provider: llamacpp # Use llama.cpp instead of PyTorch
  llamacpp:
    model_path: "../models/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf"
    max_tokens: 2048 # Increased for comprehensive documentation with examples
    temperature: 0.1
    n_ctx: 16384
    n_gpu_layers: -1 # Enable Metal GPU acceleration (all layers)
    n_threads: 1 # GPU mode only needs 1 thread
    n_batch: 512
    use_mlock: true
    verbose: false
